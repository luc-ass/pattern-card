<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pattern Card – Vorschau</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  /* HA-Theme-Variablen (Standard hell/dunkel, gekürzt) */
  :root {
    --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
    --card-background-color: #fff; --primary-background-color: #fafafa; --secondary-background-color: #e5e5e5;
    --divider-color: rgba(0,0,0,.12); --info-color: #039be5; --disabled-text-color: #bdbdbd;
    --graph-color-1: #4269d0; --graph-color-2: #efb118; --graph-color-3: #ff725c; --state-active-color: #ff9800; --state-binary_sensor-active-color: #ff9800;
    --state-light-active-color: #ffc107; --amber-color: #ffc107; --red-color: #f44336; --green-color: #4caf50;
    --blue-color: #2196f3; --purple-color: #926bc7; --teal-color: #009688;
    --ha-font-size-xs: 10px; --ha-font-size-s: 12px; --ha-font-size-m: 14px; --ha-font-size-2xl: 24px;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c;
    --primary-background-color: #111; --secondary-background-color: #282828; --divider-color: rgba(225,225,225,.12);
  }
  body { margin: 0; background: var(--primary-background-color); color: var(--primary-text-color); }
  header { padding: 16px 24px; display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 20px; font-weight: 500; margin: 0; flex: 1; }
  header button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--divider-color); background: var(--card-background-color); color: inherit; cursor: pointer; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; padding: 0 24px 24px; }
  .slot p { margin: 4px 4px 8px; font-size: 12px; color: var(--secondary-text-color); font-family: monospace; white-space: pre; }
</style>
</head>
<body>
<header>
  <h1>Pattern Card – Vorschau mit simulierten Daten</h1>
  <button id="theme">Hell/Dunkel</button>
</header>
<main id="cards"></main>

<script>
/* ---- Stubs für HA-Elemente ---- */
customElements.define("ha-card", class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" }).innerHTML = `<style>
      :host { display:block; background:var(--card-background-color); border:1px solid var(--divider-color);
        border-radius:12px; color:var(--primary-text-color); position:relative; }
      ::slotted(.card-header) { font-size:var(--ha-font-size-2xl); line-height:1.2; padding:20px 16px 24px; margin:0; font-weight:400; }
    </style><slot></slot>`;
  }
});
customElements.define("ha-alert", class extends HTMLElement {
  connectedCallback() { this.style.cssText = "display:block;padding:8px 12px;border-radius:4px;background:rgba(255,152,0,.12)"; }
});
customElements.define("ha-chart-tooltip-marker", class extends HTMLElement {
  connectedCallback() {
    this.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:10px;margin-inline-end:4px;vertical-align:middle;background:${this.getAttribute("color")}`;
  }
});
/* Nachbau von ha-chart-base mit ECharts aus dem CDN, nur für die Vorschau */
customElements.define("ha-chart-base", class extends HTMLElement {
  set data(v) { this._data = v; this._update(); }
  get data() { return this._data; }
  set options(v) { this._options = v; this._update(); }
  get options() { return this._options; }
  connectedCallback() {
    if (!this._div) {
      this._div = document.createElement("div");
      this._div.style.cssText = "width:100%;height:240px";
      this.appendChild(this._div);
      new ResizeObserver(() => this._chart && this._chart.resize()).observe(this._div);
    }
    this._update();
  }
  _update() {
    if (!this._div || !this._data || !this._options || !window.echarts) return;
    const cs = getComputedStyle(this);
    const v = (n) => cs.getPropertyValue(n).trim();
    this._chart = this._chart || echarts.init(this._div);
    const o = this._options;
    this._chart.setOption({
      ...o,
      legend: { show: o.legend.show !== false, data: o.legend.data.map((d) => d.name), bottom: 0, textStyle: { color: v("--primary-text-color") } },
      // Platz für die Legende unter der Achse, bei vielen Einträgen zweizeilig
      grid: { ...o.grid, bottom: o.legend.show === false ? 4 : o.legend.data.length > 4 ? 56 : 32 },
      xAxis: o.xAxis.map((x) => ({ ...x, axisLabel: { color: v("--secondary-text-color"), formatter: "{HH}:{mm}" }, splitLine: { show: false } })),
      yAxis: { ...o.yAxis, axisLabel: { ...o.yAxis.axisLabel, color: v("--secondary-text-color") }, nameTextStyle: { color: v("--secondary-text-color"), align: "left" }, splitLine: { lineStyle: { color: v("--divider-color") } } },
      tooltip: { ...o.tooltip, backgroundColor: v("--card-background-color"), borderColor: v("--divider-color"), textStyle: { color: v("--primary-text-color"), fontSize: 12 } },
      series: this._data,
    }, true);
  }
});
</script>

<script>window.__PATTERN_CARD_TEST__ = true;</script>
<script>
<!--__CARD_SOURCE__-->
</script>

<script>
/* ---- Simulierte Daten ---- */
const TZ = "Europe/Berlin";
const H = 3600e3;
const rnd = (seed) => { let x = Math.sin(seed) * 10000; return x - Math.floor(x); };
const P = window.__patternCard;
const localHour = (t) => ((t + P.tzOffset(t, TZ)) / H) % 24;
const weekdayAt = (t) => (new Date(t + P.tzOffset(t, TZ)).getUTCDay() + 6) % 7;

// Leistung: Grundlast, Morgen- und Abendspitze, Wochenende später
// Sprache der Vorschau: ?lang=en für die Bilder der README
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "de";
const L = (de, en) => (LANG === "en" ? en : de);
// Streuung je Tag, damit die Bänder sichtbar werden
const dayKey = (t) => Math.floor((t + P.tzOffset(t, TZ)) / 864e5);
const power = (t) => {
  const h = localHour(t);
  const we = weekdayAt(t) >= 5;
  const peak = (c, w, a) => a * Math.exp(-((h - c) ** 2) / (2 * w * w));
  const d = dayKey(t);
  const s1 = (rnd(d * 7.13) - 0.5) * 1.6;
  const s2 = (rnd(d * 3.71) - 0.5) * 2;
  const a = 0.6 + rnd(d * 1.97) * 0.8;
  return 180 + peak((we ? 9.5 : 7) + s1, 0.8, 600 * a) + peak(12.5 + s2, 1, (we ? 900 : 300) * (0.5 + rnd(d * 5.3))) + peak(19 + s1 / 2, 1.5, 1100 * a) + rnd(Math.floor(t / 300e3)) * 250;
};
// Leistung mit neuem Gerät: seit einer Woche abends zusätzlich ein Trockner (für „letzte Tage gegen davor“)
const recentFrom = Date.now() - 7 * 864e5;
const powerNew = (t) => {
  const h = localHour(t);
  return power(t) + (t >= recentFrom ? 900 * Math.exp(-((h - 20.5) ** 2) / (2 * 0.9 * 0.9)) : 0);
};
// Bewegung Gäste-WC: kurze Besuche, häufiger morgens und abends
// Therme: vor dem Stichtag häufige kurze Starts, danach seltener (für vorher/nachher)
const SINCE = (() => { const d = new Date(Date.now() - 10 * 864e5); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
const sinceTs = new Date(`${SINCE}T00:00:00`).getTime();
const boilerEntries = (start, end) => {
  const out = [{ s: "off", lu: start / 1000 }];
  for (let t = Math.ceil(start / 300e3) * 300e3; t < end; t += 300e3) {
    const h = localHour(t);
    const demand = 0.35 + 0.25 * Math.cos(((h - 5) / 24) * 2 * Math.PI); // nachts und morgens mehr
    const p = t < sinceTs ? demand * 0.9 : demand * 0.45;
    if (rnd(t / 997) < p) out.push({ s: "on", lu: t / 1000 }, { s: "off", lu: Math.min(end, t + 90e3) / 1000 });
  }
  return out;
};
const motionEntries = (start, end) => {
  const out = [{ s: "off", lu: start / 1000 }];
  for (let t = Math.ceil(start / 600e3) * 600e3; t < end; t += 600e3) {
    const h = localHour(t);
    const p = (h > 6 && h < 9 ? 0.35 : 0) + (h > 17 && h < 23 ? 0.25 : 0) + (h > 9 && h < 17 ? (weekdayAt(t) >= 5 ? 0.2 : 0.04) : 0) + 0.01;
    if (rnd(t / 1000) < p) {
      const dur = 60e3 + rnd(t / 777) * 240e3;
      out.push({ s: "on", lu: t / 1000 }, { s: "off", lu: Math.min(end, t + dur) / 1000 });
    }
  }
  return out;
};

// Waschmaschine: samstags meist gegen 10:30, mittwochs abends ab und zu, sonst selten
const washerEntries = (start, end) => {
  const out = [{ s: "off", lu: start / 1000 }];
  for (let day = Math.floor(start / 864e5) - 1; day * 864e5 < end; day++) {
    const t = day * 864e5;
    const wd = weekdayAt(t + 12 * H);
    const off = -P.tzOffset(t + 12 * H, TZ);
    const at = (h) => t + off + h * H;
    const runs = [];
    if (wd === 5 && rnd(day * 1.37) < 0.8) runs.push(at(10.2 + rnd(day * 2.1) * 0.7));
    if (wd === 2 && rnd(day * 4.11) < 0.45) runs.push(at(18 + rnd(day * 3.3) * 2));
    if (rnd(day * 6.7) < 0.15) runs.push(at(8 + rnd(day * 5.9) * 12));
    for (const r of runs.sort((a, b) => a - b)) {
      if (r >= start && r < end) out.push({ s: "on", lu: r / 1000 }, { s: "off", lu: Math.min(end, r + 1.6 * H) / 1000 });
    }
  }
  return out;
};
// Werkstatt: Licht freitags meist 22–2 Uhr (über Mitternacht), sonntags oft 23–1 Uhr (Sonntag auf Montag)
const workshopEntries = (start, end) => {
  const out = [{ s: "off", lu: start / 1000 }];
  for (let day = Math.floor(start / 864e5) - 1; day * 864e5 < end; day++) {
    const t = day * 864e5;
    const wd = weekdayAt(t + 12 * H);
    const at = (h) => t - P.tzOffset(t + 12 * H, TZ) + h * H;
    const runs = [];
    if (wd === 4 && rnd(day * 1.91) < 0.85) runs.push([at(21.9 + rnd(day * 2.3) * 0.15), at(26.2 + rnd(day * 1.1) * 0.6)]);
    if (wd === 6 && rnd(day * 2.77) < 0.8) runs.push([at(23 + rnd(day * 3.9) * 0.2), at(25.1 + rnd(day * 4.4) * 0.5)]);
    if (rnd(day * 8.3) < 0.12) runs.push([at(15 + rnd(day * 7.1) * 3), at(16.5 + rnd(day * 7.1) * 3)]);
    for (const [a, b] of runs) if (b > start && a < end) out.push({ s: "on", lu: Math.max(a, start) / 1000 }, { s: "off", lu: Math.min(end, b) / 1000 });
  }
  return out.sort((x, y) => x.lu - y.lu);
};
// Neuer Bewegungsmelder: Verlauf erst seit 4 Tagen, davor keine Daten (Diagonale)
const NEW_SINCE = Date.now() - 4 * 864e5 - 5 * H;
// Leistung mit Messlücke: jede Nacht 1–5 Uhr ohne Werte (Gerät aus), Graph mit grauem Hintergrund
const gapHour = (t) => { const h = localHour(t); return h >= 1 && h < 5; };
const states = {
  "binary_sensor.werkstatt": { entity_id: "binary_sensor.werkstatt", state: "off", attributes: { friendly_name: L("Licht Werkstatt", "Workshop light"), device_class: "light" } },
  "binary_sensor.bewegung_neu": { entity_id: "binary_sensor.bewegung_neu", state: "off", attributes: { friendly_name: L("Bewegung Flur (neu)", "Hallway motion (new)"), device_class: "motion" } },
  "sensor.leistung_luecke": { entity_id: "sensor.leistung_luecke", state: "120", attributes: { friendly_name: L("Leistung Werkbank", "Workbench power"), unit_of_measurement: "W", state_class: "measurement", device_class: "power" } },
  "sensor.leistung": { entity_id: "sensor.leistung", state: "642", attributes: { friendly_name: L("Strom Netzbezug", "Grid power"), unit_of_measurement: "W", state_class: "measurement", device_class: "power" } },
  "sensor.zaehler": { entity_id: "sensor.zaehler", state: "12345", attributes: { friendly_name: L("Stromzähler", "Grid energy"), unit_of_measurement: "kWh", state_class: "total_increasing", device_class: "energy" } },
  "sensor.leistung_neu": { entity_id: "sensor.leistung_neu", state: "642", attributes: { friendly_name: L("Strom Netzbezug", "Grid power"), unit_of_measurement: "W", state_class: "measurement", device_class: "power" } },
  "binary_sensor.therme": { entity_id: "binary_sensor.therme", state: "off", attributes: { friendly_name: L("Therme Brenner", "Boiler burner"), device_class: "running" } },
  "binary_sensor.waschmaschine": { entity_id: "binary_sensor.waschmaschine", state: "off", attributes: { friendly_name: L("Waschmaschine", "Washing machine"), device_class: "running" } },
  "binary_sensor.bewegung": { entity_id: "binary_sensor.bewegung", state: "off", attributes: { friendly_name: L("Bewegung Gäste-WC", "Guest toilet motion"), device_class: "motion" } },
};

const hass = {
  locale: { language: LANG, number_format: "language", time_format: "24", time_zone: "server" },
  config: { time_zone: TZ },
  states,
  entities: {},
  themes: { darkMode: false },
  callWS: async (msg) => {
    const s = Date.parse(msg.start_time);
    const e = Math.min(Date.parse(msg.end_time), Date.now());
    const id = (msg.statistic_ids || msg.entity_ids)[0];
    if (msg.type === "recorder/get_statistics_metadata") {
      if (id === "sensor.leistung" || id === "sensor.leistung_neu" || id === "sensor.leistung_luecke") return [{ statistic_id: id, has_sum: false, mean_type: 1, unit_class: "power" }];
      if (id === "sensor.zaehler") return [{ statistic_id: id, has_sum: true, mean_type: 0, unit_class: "energy" }];
      return [];
    }
    if (msg.type === "recorder/statistics_during_period") {
      const step = msg.period === "hour" ? H : 300e3;
      const rows = [];
      for (let t = Math.ceil(s / step) * step; t + step <= e; t += step) {
        let m = 0;
        if (id === "sensor.leistung_luecke" && gapHour(t)) continue;
        const f = id === "sensor.leistung_neu" ? powerNew : power;
        for (let u = t; u < t + step; u += 300e3) m += f(u) / (step / 300e3);
        rows.push(id === "sensor.zaehler" ? { start: t, end: t + step, change: (m * step) / H / 1000 } : { start: t, end: t + step, mean: m });
      }
      return { [id]: rows };
    }
    if (msg.type === "history/history_during_period" && id === "binary_sensor.werkstatt") return { [id]: workshopEntries(s, e) };
    if (msg.type === "history/history_during_period" && id === "binary_sensor.bewegung_neu") return { [id]: e > NEW_SINCE ? motionEntries(Math.max(s, NEW_SINCE), e) : [] };
    if (msg.type === "history/history_during_period") return { [id]: id === "binary_sensor.therme" ? boilerEntries(s, e) : id === "binary_sensor.waschmaschine" ? washerEntries(s, e) : motionEntries(s, e) };
    return null;
  },
};

const configs = [
  { type: "custom:pattern-card", entity: "sensor.leistung", mode: "graph", days: 28 },
  { type: "custom:pattern-card", entity: "sensor.leistung", mode: "graph", days: 28, weekdays: ["sat", "sun"], band: "minmax", name: L("Strom am Wochenende", "Power at weekends") },
  { type: "custom:pattern-card", entity: "sensor.zaehler", mode: "graph", days: 14, cumulative: true },
  { type: "custom:pattern-card", entity: "sensor.leistung", mode: "heatmap", days: 56, color: "amber" },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "heatmap", days: 28 },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "heatmap", days: 28, statistic: "events", colors: ["#e3f2fd", "#0d47a1"] },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "graph", days: 28 },
  { type: "custom:pattern-card", entity: "sensor.leistung", mode: "graph", days: 28, compare: "weekday_weekend", name: L("Werktage gegen Wochenende", "Workdays vs. weekend") },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "heatmap", days: 28, compare: "weekday_weekend", name: L("Belegung Werktage/Wochenende", "Occupancy: workdays vs. weekend") },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "heatmap", days: 28, weekdays: ["mon", "thu"], weekdays_b: ["tue", "wed", "fri"], name: L("Belegung: Mo + Do gegen Di + Mi + Fr", "Occupancy: Mon + Thu vs. Tue + Wed + Fri") },
  { type: "custom:pattern-card", entity: "sensor.leistung", mode: "graph", days: 28, weekdays: ["mon", "thu"], weekdays_b: ["tue", "wed", "fri"], name: L("Strom: Mo + Do gegen Di + Mi + Fr", "Power: Mon + Thu vs. Tue + Wed + Fri") },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "heatmap", days: 28, weekdays: ["mon", "thu"], name: L("Belegung nur Mo und Do", "Occupancy: Mon and Thu only") },
  { type: "custom:pattern-card", entity: "binary_sensor.therme", mode: "heatmap", days: 28, statistic: "events", compare: "before_after", since: SINCE, difference_colors: ["green", "red"], name: L("Brennerstarts vorher/nachher", "Boiler starts: before vs. after") },
  { type: "custom:pattern-card", entity: "sensor.leistung_neu", mode: "heatmap", days: 56, compare: "recent", recent_days: 7, color: "amber", name: L("Letzte Woche gegen die 8 Wochen davor", "Last week vs. the eight weeks before") },
  { type: "custom:pattern-card", entity: "binary_sensor.waschmaschine", mode: "heatmap", days: 56, statistic: "events", regularity: { enabled: true, threshold: 70 }, name: L("Waschmaschine: regelmäßige Starts", "Washing machine: recurring starts") },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung", mode: "heatmap", days: 28, regularity: { enabled: true, threshold: 80, color: "purple" }, name: L("Gäste-WC: regelmäßig genutzt", "Guest toilet: regularly used") },
  { type: "custom:pattern-card", entity: "binary_sensor.werkstatt", mode: "heatmap", days: 56, statistic: "active", regularity: { enabled: true, threshold: 70 }, color: "amber", name: L("Werkstatt: Freitagnacht über Mitternacht", "Workshop: Friday night across midnight") },
  { type: "custom:pattern-card", entity: "binary_sensor.werkstatt", mode: "heatmap", days: 56, statistic: "active", weekdays: ["fri", "sun"], regularity: { enabled: true, threshold: 70 }, color: "amber", name: L("Werkstatt: nur Fr und So (ohne Übergang)", "Workshop: Fri and Sun only (no crossing)") },
  { type: "custom:pattern-card", entity: "binary_sensor.bewegung_neu", mode: "heatmap", days: 28, statistic: "events", name: L("Neuer Melder: fehlende Daten", "New sensor: missing data") },
  { type: "custom:pattern-card", entity: "sensor.leistung_luecke", mode: "graph", days: 14, name: L("Werkbank: nachts keine Daten", "Workbench: no data at night") },
];

const yamlVal = (v) => (Array.isArray(v) ? `[${v.join(", ")}]` : v);
const yaml = (c) => Object.entries(c).map(([k, v]) => (v && typeof v === "object" && !Array.isArray(v)
  ? `${k}:\n${Object.entries(v).map(([k2, v2]) => `  ${k2}: ${yamlVal(v2)}`).join("\n")}`
  : `${k}: ${yamlVal(v)}`)).join("\n");
const cards = [];
for (const c of configs) {
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.innerHTML = `<p>${yaml(c)}</p>`;
  const el = document.createElement("pattern-card");
  el.setConfig(c);
  slot.appendChild(el);
  document.getElementById("cards").appendChild(slot);
  el.hass = hass;
  cards.push(el);
}

document.getElementById("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const h = { ...hass, themes: { darkMode: dark } };
  cards.forEach((c) => { c.hass = h; });
});
</script>
</body>
</html>
